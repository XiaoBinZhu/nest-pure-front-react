        client_max_body_size 50m;
    }

    # 系统接口（C 端 _api.ts 401 自动刷新调用 /system/auth/refresh-token，
    # 必须转发 nest-admin，否则 SPA 回退 index.html 导致 JSON.parse 失败）
    location /system/ {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        client_max_body_size 50m;
    }

    # ---- 对外 OpenAI 兼容入口（/v1/* -> nest-admin 管理计费中继 / usage-proxy 快路径）----
    # 外部用户（Cursor / Cherry Studio / ChatBox 等）用管理端生成的 sk- 令牌接入
    # https://www.007icu.top/v1，走完整「AI 网关管理计费」链路：
    #   TokenAuthGuard 鉴权(sk-/JWT) → 模型可用性/分组 → 余额/配额校验 → 渠道 failover
    #   → gateway(Portkey) 中转 → 上游 → usage 解析 → 扣费(双轨) → 日志/看板。
    # AI 聊天流式请求（chat/completions）走方案A 边缘代理快路径（境外 usage-proxy）：
    #   /v1/chat/completions 与 /ai/v1/chat/completions → usage_proxy_fallback
    #   （主: 境外本机 usage-proxy 8790 → 本机 gateway，AI 流式全程不出境；
    #    备: 国内 nest-admin relay，usage-proxy 不可用时自动回退，计费链路不变）
    # 免费模型限流（rpm/rpd/tpm/tpd/rps/req·时）由 gateway 中间件执行，usage-proxy 转发
    # 同样携带 body.model，超限返回 429（rate_limit_exceeded）。
    # 裸 gateway 直连入口保留在 /gateway/v1（见上方 /gateway/ location），供需要直连中转的场景。
    # 修复历史：无尾斜杠 /v1 曾落入 SPA try_files 回退返回 index.html（“跳转 C 端”）——
    # 已由下方 location = /v1 精确匹配解决。

    # 方案A 快路径：AI 聊天流式请求直连境外 usage-proxy（AI 数据不出境，跨境仅 check/settle 轻量调用）
    location = /v1/chat/completions {
        proxy_pass http://usage_proxy_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    # C 端聊天快路径（前端 /ai/v1/chat/completions → usage-proxy，与 /v1/chat/completions 等效）
    location = /ai/v1/chat/completions {
        proxy_pass http://usage_proxy_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    location = /v1 {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;
    }

    location /v1/ {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    # ---- C 端 AI 中继（/ai/v1/* -> nest-admin /v1/*，JWT 双轨 / sk- 令牌）----
    # C 端聊天与模型目录走此路径（2026-08-19 起，与 /v1 等效，均为 nest-admin 管理计费中继）。
    # rewrite 去掉 /ai/v1 前缀后转发到 nest-admin 集群（nest-admin 控制器前缀为 /v1）。
    location /ai/v1/ {
        rewrite ^/ai/v1/(.*)$ /v1/$1 break;
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    # ---- LobeHub 原生 /webapi/*（SPA 模式无 Next.js 后端）----
    # 防御：转发到 nest-admin 返回 JSON 404，避免 SPA 回退 index.html 导致前端 JSON.parse 崩溃
    # （模型明细/TTS/telemetry 等次要功能暂不支持，主模型选择器走 /v1/models 目录）
    location /webapi/ {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- PWA Manifest (必须 application/manifest+json) ----
    # 修复浏览器控制台 "Manifest: Line: 1, column: 1, Syntax error"
    # nginx 默认把 .webmanifest 当作 application/octet-stream, 浏览器拒绝解析
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---- Auth SPA 路由 (独立 entry: index.auth.html) ----
    # LobeHub 前端把 /signin, /signup, /reset-password, /verify-email, /auth-error
    # 等认证页面拆分为独立的 SPA bundle (_spa-auth/), 与主应用分离以减少首屏体积
    # 这些路由必须返回 _spa-auth/index.auth.html, 让浏览器加载 auth bundle
    # 其余根级路由 (/chat, /files, /settings 等) 由主 SPA (index.html) 处理
    location ~ ^/(signin|signup|reset-password|verify-email|auth-error)(/|$) {
        rewrite ^ /_spa-auth/index.auth.html last;
    }

    location ~ ^/oauth/(callback|consent|device) {
        rewrite ^ /_spa-auth/index.auth.html last;
    }

    location ~ ^/market-auth-callback {
        rewrite ^ /_spa-auth/index.auth.html last;
    }

    # ---- Auth SPA 静态资源 (/_spa-auth/*) ----
    # index.auth.html 内部以 /_spa-auth/ 为 base 引用 assets/i18n/vendor
    location /_spa-auth/ {
        alias /usr/share/nginx/front/_spa-auth/;
        try_files $uri =404;
        # auth bundle 文件带 hash, 可长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # ---- Auth SPA 入口 (index.auth.html, 被上面 rewrite 命中) ----
    location = /_spa-auth/index.auth.html {
        alias /usr/share/nginx/front/_spa-auth/index.auth.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    # ---- nest-admin 其他根级路由 (/admin, /socket.io 等) ----
    # Socket.IO / admin 长连接: sticky session (ip_hash 保持会话)
    location ~ ^/(admin|socket\.io|graphql|uploads|files)/ {
        proxy_pass http://nest_admin_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50m;
    }

    # ---- 静态资源长缓存 ----
    # 构建产物文件带内容 hash, 内容变化文件名即变化, 可安全一年 immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /i18n/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存, 保证发版后用户立即拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # service worker 不缓存
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ---- SPA 回退: 所有未匹配路由返回 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
