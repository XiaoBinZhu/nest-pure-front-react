        return 200 '{"result":{"data":{"json":null}}}';
    }

    # ---- 补充 mock：侧栏/首页/最近/连接器/内置 Agent（空数据，避免 404 崩溃） ----
    # getBuiltinAgent 需顶层含 id（builtin action 检查 data?.id，G9 修复）
    location = /trpc/lambda/agent.getBuiltinAgent {
