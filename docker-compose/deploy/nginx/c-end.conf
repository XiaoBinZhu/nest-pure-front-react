##
# C 端 LobeHub 前端（纯静态 SPA）+ nest-admin 后端反代配置
#
# 部署位置 (国外服务器): /usr/share/nginx/conf.d/c-end.conf
# 与 admin.conf + internal-gateway.conf 共用 8080 端口, 通过 server_name 区分
#
# - 雷池 WAF 终结 SSL (443) -> 回源到本机 Nginx 8080 (HTTP)
# - 80/443 端口由雷池 tengine 接管, Nginx 仅监听 8080 接收回源流量
#
# 优化要点 (2026-08):
#   1. gzip_static on - 直接发送构建期预压缩的 .gz 文件, 零 CPU 开销
#   2. brotli_static on - 直接发送构建期预压缩的 .br 文件 (nginx 1.31.3 + 编译安装的 ngx_brotli 动态模块)
#   3. 静态资源 (assets/i18n/vendor) 带 hash, 缓存提升至 1 年 immutable
#   4. index.html / sw.js / manifest 均 no-cache, 发版立即生效
#   5. 安全响应头: nosniff / frame 防护 / referrer 策略
#
# 路由结构:
# /nest-admin/*   -> 国内 nest-admin 后端 (WireGuard 隧道到 10.0.0.2)
# /gateway/*      -> 本机 AI Gateway (Portkey, 127.0.0.1:8787/8788)；裸中转直连入口 /gateway/v1
# /v1/chat/completions 与 /ai/v1/chat/completions -> 境外 usage-proxy(8790) 快路径（方案A）：
#   AI 流式全程不出境（usage-proxy → gateway → 上游），跨境仅 /ai/edge/check + /ai/edge/settle
#   轻量预检/结算；usage-proxy 不可用时自动回退国内 nest-admin relay（usage_proxy_fallback backup）
# /v1/* 与 /ai/v1/*（其余）-> 国内 nest-admin /v1/*（对外 OpenAI 兼容入口，管理计费链路）
# /trpc/*         -> 纯 SPA mock JSON (无 Next.js 运行时)
# /               -> LobeHub 前端静态文件 (/usr/share/nginx/front)
##

# WebSocket 升级支持
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP 8080 -> 雷池回源 (SSL 已由雷池终结)
server {
    listen 8080;
    listen [::]:8080;
    server_name www.007icu.top;

    root /usr/share/nginx/front;
    index index.html;

    # 安全响应头 (location 内 add_header 会覆盖继承, 关键 location 需自带)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 构建期预压缩产物直发 (compressSpa.mts 生成 .gz/.br 旁路文件)
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff application/font-woff2 font/ttf;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Brotli (ngx_brotli 动态模块, 与 nginx 1.31.3 同源编译)
    # brotli_static 优先直发 .br 预压缩文件, 请求不带 br 时回退 gzip
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff application/font-woff2 font/ttf;

    # ---- nest-admin 后端统一反代 (/nest-admin/*) ----
    # 所有 nest-admin API 统一在 /nest-admin 前缀下, rewrite 后转发到国内服务器
    # 例: /nest-admin/system/auth/login -> 国内服务器 /system/auth/login
    location /nest-admin/ {
        # 去掉 /nest-admin 前缀后转发
        rewrite ^/nest-admin/(.*)$ /$1 break;

        # WebSocket 升级支持 (/nest-admin/socket.io/*)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 通用代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 关键优化: TCP keepalive + 故障转移
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;

        # 转发到 nest-admin 集群 (WireGuard 隧道到国内 10.0.0.2)
        proxy_pass http://nest_admin_cluster;
    }

    # ---- AI Gateway 反代 (Portkey v1.15.2, /gateway/*) ----
    # nest-admin 后端 LogStreamService 依赖 /gateway/log/stream (SSE)
    # /gateway/v1/* -> CURSOR/SDK 调用; /gateway/public/* -> gateway UI
    # /gateway/log/stream -> SSE 日志流; /gateway/health -> 健康检查
    # Gateway SSE 日志流 + admin UI (sticky session, 需要会话保持)
    location ~ ^/gateway/(log/stream|public) {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://gateway_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        # SSE/WebSocket 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        client_max_body_size 50m;
    }

    # Gateway realtime WebSocket (sticky session, 长连接)
    location /gateway/v1/realtime {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://gateway_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gateway 普通 API 请求 (round_robin 负载均衡)
    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE 支持 (chat completion 流式响应)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        # 大请求体支持 (图片/音频生成)
        client_max_body_size 50m;
    }

    # 健康检查 (round_robin, 无鉴权)
    location = /gateway/health {
        proxy_pass http://gateway_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- Swagger API 文档 (/api-docs) ----
    location /api-docs {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
    }

    # ---- tRPC 路由 (纯 SPA 模式下无 Next.js 运行时) ----
    # 1. config.getGlobalConfig / config.getDefaultAgentConfig: 返回 mock 配置
    #    让 LobeHub 前端能拿到 serverConfig 渲染登录表单 (依赖 enableMagicLink/disableEmailPassword)
    # 2. 侧栏/首页/最近/连接器/内置 Agent 等端点返回空数据 mock（避免组件渲染崩溃）
    # 3. 其他 /trpc/ 路由: 返回 tRPC NOT_FOUND 错误 JSON, 避免前端 JSON.parse 失败
    #    核心对话/会话/消息功能已通过 apiFetch (REST) 实现, 不依赖 tRPC
    # 注意: batch=1 请求需要数组包装响应（tRPC batch 协议）
    location = /trpc/lambda/config.getGlobalConfig {
        default_type application/json;
        add_header Cache-Control "no-store";
        if ($arg_batch = 1) {
            return 200 '[{"result":{"data":{"json":{"serverConfig":{"telemetry":{"langfuse":false}},"serverFeatureFlags":{},"billboard":null}}}}]';
        }
        return 200 '{"result":{"data":{"json":{"serverConfig":{"telemetry":{"langfuse":false}},"serverFeatureFlags":{},"billboard":null}}}}';
    }

    location = /trpc/lambda/config.getDefaultAgentConfig {
        default_type application/json;
        add_header Cache-Control "no-store";
        if ($arg_batch = 1) {
            return 200 '[{"result":{"data":{"json":{"model":"gpt-4o-mini","provider":"openai","params":{}}}}}]';
        }
        return 200 '{"result":{"data":{"json":{"model":"gpt-4o-mini","provider":"openai","params":{}}}}}';
    }

    location = /trpc/lambda/user.getUserState {
        default_type application/json;
        add_header Cache-Control "no-store";
        if ($arg_batch = 1) {
            return 200 '[{"result":{"data":{"json":null}}}]';
