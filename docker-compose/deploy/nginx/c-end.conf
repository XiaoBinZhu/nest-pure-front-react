    # ---- C 端业务 API 反代（项目前缀规范 2026-08-10，2026-08-19 更新）----
    # C 端前端相对路径请求：/app/front-hub/*（业务）、/api/auth/*（登录）、
    # /ai/v1/*（AI 中继 OpenAI 兼容，见上方 /ai/v1 location）、/auth/*（旧兼容）全部转发到 nest-admin 集群
    # 注意：必须放在 location / （SPA 回退）之前，否则会被 try_files 拦截返回 index.html
    location /app/ {
        proxy_pass http://nest_admin_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_socket_keepalive on;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;
    }

