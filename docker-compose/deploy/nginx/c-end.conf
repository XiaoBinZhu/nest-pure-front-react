        }
        return 200 '{"result":{"data":{"json":{"id":"inbox","agentId":"inbox","slug":"inbox","title":"Inbox","description":"default","model":"deepseek-ai/deepseek-v4-pro","provider":"openai","settings":{},"createAt":0}}}}';
    }

